<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2F3E46" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF5F1" />
    <!-- iOS home-screen apps only draw under the status bar when asked:
         black-translucent makes the web view truly full screen (the page
         background paints behind the clock instead of an opaque system
         strip). Content clearance comes from the --safe-top padding that
         every top-anchored element already uses. Status bar text follows
         the system light/dark mode, which matches our color-scheme theming. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kody Video" />
    <meta
      name="description"
      content="Kody Video — hold anywhere to record clips. Privacy-first camera for the web."
    />
    <link rel="canonical" href="https://kody.video/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kody Video" />
    <meta property="og:title" content="Kody Video — hold to record, tap Go to share" />
    <meta
      property="og:description"
      content="A private, on-device clips camera for the web. Record shot by shot, trim on a filmstrip, export one video. Free & open source."
    />
    <meta property="og:url" content="https://kody.video/" />
    <meta property="og:image" content="https://kody.video/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kody the koala filming a vertical video on his phone — Kody Video" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kody Video — hold to record, tap Go to share" />
    <meta
      name="twitter:description"
      content="A private, on-device clips camera for the web. Free & open source."
    />
    <meta name="twitter:image" content="https://kody.video/og-image.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      href="/art/kody-holding-camera-192.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <!-- Critical first-paint styles for the permanent boot hero. Lives outside
         #app so SPA boot cannot destroy it; that was lantern's multi-second
         LCP "render delay" when the hero was re-created by JS. -->
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #172126;
        --bg: #2f3e46;
        --bg-bottom: #10171a;
        --ink: #f3f5f4;
        --ink-muted: #b0b8bc;
        --accent: #44d7a8;
        --glow-accent: rgba(68, 215, 168, 0.2);
        --glow-mist: rgba(176, 184, 188, 0.18);
        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'DM Sans', 'Segoe UI', sans-serif;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg-deep: #dfeae4;
          --bg: #eef5f1;
          --bg-bottom: #cfdcd5;
          --ink: #1a2824;
          --ink-muted: #5a6d66;
          --accent: #1f8a68;
          --glow-accent: rgba(31, 138, 104, 0.18);
          --glow-mist: rgba(95, 133, 117, 0.16);
        }
      }
      /* Must match global.css from first paint — otherwise the desktop
         phone frame reflows when border-box arrives (large CLS). */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        /* Reserve scrollbar space so desktop overflow:auto cannot shift the
           centered #root when the SPA paints taller content. */
        scrollbar-gutter: stable;
      }
      html,
      body,
      #root,
      #app {
        margin: 0;
        min-height: 100%;
        height: 100%;
      }
      #root {
        width: min(480px, 100%);
      }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background:
          radial-gradient(120% 80% at 10% -10%, var(--glow-accent), transparent 55%),
          radial-gradient(90% 70% at 100% 0%, var(--glow-mist), transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 58%, var(--bg-bottom) 100%);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root {
        position: relative;
        max-width: 480px;
        margin-left: auto;
        margin-right: auto;
      }
      /* Below #app (z-index 1) so in-app overlays (e.g. the update toast)
         can paint above the LCP brand. Transparent #app regions still let
         this hero show through on the home route. */
      #boot-hero {
        position: absolute;
        top: calc(12px + var(--safe-top));
        left: 0;
        right: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2px;
        pointer-events: none;
      }
      #boot-hero .brand-hero-art {
        width: 96px;
        height: 96px;
        margin: 0 0 4px;
        border-radius: 24px;
        background: rgba(243, 245, 244, 0.06);
        display: block;
      }
      #boot-hero .brand {
        font-family: var(--font-display);
        font-weight: 700;
        letter-spacing: -0.03em;
        font-size: clamp(1.65rem, 7vw, 2.1rem);
        line-height: 0.95;
        margin: 0;
      }
      #boot-hero .brand span {
        color: var(--accent);
      }
      #boot-hero .lede {
        margin: 4px 0 0;
        color: var(--ink-muted);
        font-size: 0.86rem;
        line-height: 1.3;
      }
      html[data-route='app'] #boot-hero {
        display: none;
      }
      /* Landscape viewports (turned phones, desktop-ish windows): the SPA
         paints the hero inside its two-pane home layout — the top-centered
         boot hero would sit in the wrong place. */
      @media (orientation: landscape) {
        #boot-hero {
          display: none;
        }
      }
      /* Shell width by layout mode — must mirror global.css (the attribute
         is set by the pre-paint script below, so the frame never jumps when
         the full stylesheet arrives). 'adaptive' (home/static pages) widens
         on landscape viewports; 'wide' (landscape projects) always. */
      html[data-shell='wide'] #root {
        width: 100%;
        max-width: none;
      }
      @media (orientation: landscape) {
        html[data-shell='adaptive'] #root {
          width: 100%;
          max-width: none;
        }
      }
      @media (min-width: 720px) and (orientation: landscape) and (pointer: fine) {
        html[data-shell='adaptive'] #root,
        html[data-shell='wide'] #root {
          width: min(1200px, calc(100% - 48px));
        }
      }
      /* Desktop: SPA paints the hero. Reserve the phone-chrome frame here so
         applying the full stylesheet does not shift the whole page (CLS).
         Fine pointers only — a phone turned sideways is also ≥720px wide,
         and held devices must stay full-bleed (match global.css). */
      @media (min-width: 720px) and (pointer: fine) {
        body {
          overflow: auto;
          /* Must match global.css: BFC keeps #root margins from collapsing
             through the 100%-tall body (phantom scroll below the fold). */
          display: flow-root;
        }
        #boot-hero {
          display: none;
        }
        #root {
          margin-top: 24px;
          margin-bottom: 24px;
          height: min(920px, calc(100dvh - 48px));
          /* Must match global.css: without this the base min-height: 100%
             wins and the frame's bottom edge falls below the fold. */
          min-height: 0;
          border-radius: 28px;
          /* Match full stylesheet: reserve border box so 1px border + shadow
             cannot reflow the frame after CSS arrives. */
          border: 1px solid rgba(243, 245, 244, 0.16);
          overflow: hidden;
        }
      }
      @media (min-width: 720px) and (pointer: fine) and (prefers-color-scheme: light) {
        #root {
          border-color: rgba(26, 40, 36, 0.12);
        }
      }
      #app {
        position: relative;
        z-index: 1;
      }
    </style>
    <script>
      // Pre-paint shell layout: home and static pages adapt to landscape
      // viewports; project pages manage their own width (set by the app once
      // it knows the project's locked orientation). Runs before first paint
      // so the frame never jumps; main.tsx keeps it synced on navigation.
      if (!location.pathname.startsWith('/project/')) {
        document.documentElement.dataset.shell = 'adaptive'
      }
    </script>
    <script>
      // Fathom Analytics (cookieless, anonymous page-view counts). Loaded
      // only on real deployments so dev servers and test runs stay out of
      // the stats; data-spa covers client-side route changes.
      if (['kody.video', 'kody-video.pages.dev'].includes(location.hostname)) {
        var fathomScript = document.createElement('script')
        fathomScript.src = 'https://cdn.usefathom.com/script.js'
        fathomScript.setAttribute('data-site', 'YKYNNRMZ')
        fathomScript.setAttribute('data-spa', 'auto')
        fathomScript.defer = true
        document.head.appendChild(fathomScript)
      }
    </script>
    <title>Kody Video</title>
  </head>
  <body>
    <div id="root">
      <header id="boot-hero">
        <img
          class="brand-hero-art"
          width="96"
          height="96"
          src="/art/kody-holding-camera-192.webp"
          alt=""
          decoding="sync"
          fetchpriority="high"
        />
        <h1 class="brand">Kody <span>Video</span></h1>
        <p class="lede">Hold to record. Tap Go to share.</p>
      </header>
      <!-- Single main landmark for screen readers (and Lighthouse a11y). -->
      <main id="app"></main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
