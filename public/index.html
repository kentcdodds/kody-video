<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2F3E46" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF5F1" />
    <!-- iOS home-screen apps only draw under the status bar when asked:
         black-translucent makes the web view truly full screen (the page
         background paints behind the clock instead of an opaque system
         strip). Content clearance comes from the --safe-top padding that
         every top-anchored element already uses. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kody Video" />
    <meta
      name="description"
      content="Kody Video — hold anywhere to record clips. Privacy-first camera for the web."
    />
    <link rel="canonical" href="https://typescript.kody.video/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kody Video" />
    <meta property="og:title" content="Kody Video — hold to record, tap Go to share" />
    <meta
      property="og:description"
      content="A private, on-device clips camera for the web. Record shot by shot, trim on a filmstrip, export one video. Free & open source. Vanilla web-components edition."
    />
    <meta property="og:url" content="https://typescript.kody.video/" />
    <meta property="og:image" content="https://typescript.kody.video/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kody the koala filming a vertical video on his phone — Kody Video" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kody Video — hold to record, tap Go to share" />
    <meta
      name="twitter:description"
      content="A private, on-device clips camera for the web. Free & open source."
    />
    <meta name="twitter:image" content="https://typescript.kody.video/og-image.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/record.css" />
    <link rel="stylesheet" href="/styles/editor.css" />
    <!-- The one dependency: Mediabunny, vendored and mapped to its bare
         specifier so the compiled modules' `import ... from 'mediabunny'`
         resolves without a bundler (the only build step is tsc). -->
    <script type="importmap">
      {
        "imports": {
          "mediabunny": "/vendor/mediabunny.min.mjs"
        }
      }
    </script>
    <title>Kody Video</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
